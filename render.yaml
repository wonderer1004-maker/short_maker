services:
  - type: web
    runtime: static
    name: short-maker-products
    buildCommand: test -f site/index.html
    staticPublishPath: site
    autoDeployTrigger: "off"
    buildFilter:
      paths:
        - site/**
        - render.yaml
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Cache-Control
        value: no-cache
