name: Daily original Shorts
on:
  schedule:
    - cron: '17 22 * * *'
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: '실행할 작업'
        type: choice
        default: run
        options:
          - run
          - upload
          - reconcile
          - metrics
permissions:
  contents: write
concurrency:
  group: shorts-production
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require private repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = true
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          python scripts/install_font.py
      - name: Connect secrets and settings
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          PUBLICATION_MODE: ${{ vars.PUBLICATION_MODE }}
          SPEECH_PROVIDER: ${{ vars.SPEECH_PROVIDER }}
          CONTENT_MODE: ${{ vars.CONTENT_MODE }}
          AFFILIATE_CONFIG_JSON: ${{ vars.AFFILIATE_CONFIG_JSON }}
          AFFILIATE_PORTAL_URL: ${{ vars.AFFILIATE_PORTAL_URL }}
        run: python scripts/github_setup.py
      - name: Configure durable checkpoints
        run: |
          git config user.name shorts-studio-bot
          git config user.email shorts-studio-bot@users.noreply.github.com
      - name: Generate and upload
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          ALI_APP_KEY: ${{ secrets.ALI_APP_KEY }}
          ALI_APP_SECRET: ${{ secrets.ALI_APP_SECRET }}
          ALI_TRACKING_ID: ${{ secrets.ALI_TRACKING_ID }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SHORTS_CHECKPOINT: '1'
          OPERATION: ${{ github.event.inputs.operation || (github.event.schedule == '17 23 * * *' && 'upload' || 'run') }}
        run: python scripts/github_run.py
      - name: Save final state
        if: always()
        run: python scripts/checkpoint.py
      - name: Save videos for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: |
            output/
            data/performance.csv
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove credential files
        if: always()
        run: rm -f token.json client_secret.json .env
